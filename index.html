<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day Tracker</title>
    <style>
        :root {
            --bg-color: #fff;
            --text-color: #000;
            --progress-bg: #f3f3f3;
            --progress-color: #4caf50;
            --config-bg: #fff;
            --config-text: #000;
            --bg-opacity: 1;
            --bg-image: none;
            --ui-opacity: 1;
            --ui-width: 800px;
        }

        :root.dark-mode {
            --bg-color: #1e1e1e;
            --text-color: #fff;
            --progress-bg: #333;
            --progress-color: #6ca6cd;
            --config-bg: #333;
            --config-text: #fff;
        }

        body {
            font-family: monospace;
            text-align: center;
            background-color: var(--bg-color);
            background-image: none;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: var(--text-color);
            margin: 0;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        #ui-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: move;
            opacity: var(--ui-opacity);
            width: var(--ui-width);
            max-width: 90vw;
        }

        #reset-position {
            position: fixed;
            bottom: 10px;
            right: 10px;
            padding: 5px 10px;
            font-size: 14px;
            background-color: var(--progress-bg);
            color: var(--text-color);
            border: none;
            cursor: pointer;
            border-radius: 5px;
            opacity: var(--ui-opacity);
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: var(--bg-opacity);
            z-index: -1;
        }

        .progress-container {
            display: flex;
            justify-content: center;
            margin: 5px auto;
            background-color: var(--bg-color);
            padding: 5px;
            border-radius: 5px;
            width: 100%;
        }

        #current-time {
            font-size: 48px;
            margin: 10px auto;
            background-color: var(--bg-color);
            padding: 5px 15px;
            border-radius: 5px;
            display: inline-block;
        }

        .block-info {
            display: flex;
            justify-content: center;
            margin: 5px auto;
            background-color: var(--bg-color);
            padding: 5px 15px;
            border-radius: 5px;
            max-width: fit-content;
        }

        .block-info>div {
            margin: 0 10px;
        }

        .block-info.hidden {
            display: none;
        }

        #motto {
            font-size: 24px;
            margin: 5px auto;
            background-color: var(--bg-color);
            padding: 5px 15px;
            border-radius: 5px;
            display: inline-block;
        }

        #total-time, #overwork-time {
            background-color: var(--bg-color);
            padding: 5px 15px;
            border-radius: 5px;
            margin: 5px auto;
            max-width: fit-content;
            display: inline-block;
        }

        .block-progress-bar {
            height: 30px;
            background-color: var(--progress-bg);
            border: 1px solid #ccc;
            position: relative;
            flex-grow: 1;
            margin: 0 5px;
            display: flex;
            align-items: center;
        }

        .block-progress-bar .progress {
            height: 100%;
            background-color: var(--progress-color);
        }

        .block-progress-bar .percentage {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
        }

        #config {
            margin: 20px auto;
            display: none;
            background-color: var(--config-bg);
            color: var(--config-text);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 500px;
        }

        #config.show {
            display: block;
        }

        #config input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin: 10px 0;
            background-color: var(--config-bg);
            color: var(--config-text);
            border: 1px solid var(--text-color);
            border-radius: 5px;
        }

        #config .setting {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
        }

        #config .setting label {
            flex: 1;
            text-align: left;
        }

        #config .setting input[type="checkbox"],
        #config .setting input[type="number"] {
            width: auto;
        }

        #config-button {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            font-size: 14px;
            background-color: var(--progress-bg);
            color: var(--text-color);
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <button id="config-button">Config</button>
    <div id="ui-container">
        <div id="motto"></div>
        <div id="current-time">00:00:00</div>
        <div class="progress-container">
            <div id="total-progress-bar" class="block-progress-bar">
                <div class="progress"></div>
                <div class="percentage">0.00%</div>
            </div>
        </div>
        <div class="progress-container" id="blocks-progress"></div>
        <div class="block-info" id="block-info">
            <div id="block-time"></div>
        </div>
        <div id="total-time"></div>
        <div id="overwork-time"></div>
    </div>
    <button id="reset-position">Reset Position</button>
    <div id="config">
        <input type="text" id="blocks-input" placeholder="Enter blocks (e.g., 0800-1230,1415-1830,1900-2030)">
        <input type="text" id="motto-input" placeholder="Enter your motto">
        <div class="setting">
            <label for="dark-mode-toggle">Dark Mode:</label>
            <input type="checkbox" id="dark-mode-toggle">
        </div>
        <div class="setting">
            <label for="time-font-size-input">Time Font Size:</label>
            <input type="number" id="time-font-size-input" min="12" max="100" step="2">
        </div>
        <div class="setting">
            <label for="motto-font-size-input">Motto Font Size:</label>
            <input type="number" id="motto-font-size-input" min="12" max="100" step="2">
        </div>
        <div class="setting">
            <label for="bg-image-input">Background Image:</label>
            <input type="file" id="bg-image-input" accept="image/*">
        </div>
        <div class="setting">
            <label for="bg-opacity">Background Opacity:</label>
            <input type="range" id="bg-opacity" min="0" max="1" step="0.05" value="1">
        </div>
        <div class="setting">
            <label for="ui-opacity">UI Transparency:</label>
            <input type="range" id="ui-opacity" min="0" max="1" step="0.05" value="1">
        </div>
        <div class="setting">
            <label for="ui-width">UI Width (px):</label>
            <input type="number" id="ui-width" min="300" max="2000" step="50" value="800">
        </div>
    </div>

    <script>
        let config = {
            blocks: [
                {
                    start: '10:00',
                    end: '12:00'
                }, 
                {
                    start: '14:00',
                    end: '18:00'
                }
            ],
            motto: 'hello world',
            darkMode: false,
            timeFontSize: 48,
            mottoFontSize: 24,
            bgImage: '',
            bgOpacity: 1,
            uiOpacity: 1,
            uiWidth: 800,
            uiPosition: { x: 50, y: 50 } // percentage of viewport
        };

        function loadConfig() {
            const savedConfig = localStorage.getItem('day-tracker');
            if (savedConfig) {
                const parsed = JSON.parse(savedConfig);
                config = { ...config, ...parsed };
            }
        }

        function updateConfig() {
            document.documentElement.classList.toggle('dark-mode', config.darkMode);
            
            document.getElementById('current-time').style.fontSize = `${config.timeFontSize}px`;
            document.getElementById('motto').style.fontSize = `${config.mottoFontSize}px`;
            document.getElementById('motto').innerText = config.motto;

            document.documentElement.style.setProperty('--ui-opacity', config.uiOpacity);
            document.documentElement.style.setProperty('--ui-width', `${config.uiWidth}px`);

            if (config.bgImage) {
                document.documentElement.style.setProperty('--bg-image', `url(${config.bgImage})`);
                document.body.style.backgroundImage = 'none';
            } else {
                document.documentElement.style.setProperty('--bg-image', 'none');
                document.body.style.backgroundImage = 'none';
            }

            document.documentElement.style.setProperty('--bg-opacity', config.bgOpacity);

            // Set position if saved
            if (config.uiPosition && config.uiPosition.x !== 50 && config.uiPosition.y !== 50) {
                const container = document.getElementById('ui-container');
                const viewportWidth = window.innerWidth;
                const viewportHeight = window.innerHeight;
                
                // Convert percentage to pixels
                const left = (config.uiPosition.x * viewportWidth) / 100;
                const top = (config.uiPosition.y * viewportHeight) / 100;
                
                // Calculate offset from center
                const rect = container.getBoundingClientRect();
                xOffset = left - viewportWidth / 2;
                yOffset = top - viewportHeight / 2;
                currentX = xOffset;
                currentY = yOffset;
                
                container.style.transform = `translate(${xOffset}px, ${yOffset}px)`;
            }
        }

        function saveConfig() {
            localStorage.setItem('day-tracker', JSON.stringify(config));
        }

        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const hours = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
            const minutes = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
            const seconds = (totalSeconds % 60).toString().padStart(2, '0');
            return `${hours}:${minutes}:${seconds}`;
        }

        function updateTime() {
            const now = new Date();
            const currentTime = now.toTimeString().split(' ')[0];
            document.getElementById('current-time').innerText = currentTime;

            if (config.blocks.length === 0) return;

            const totalWorkTime = config.blocks.reduce((acc, block) => {
                const start = new Date(now.toDateString() + ' ' + block.start).getTime();
                const end = new Date(now.toDateString() + ' ' + block.end).getTime();
                return acc + (end - start);
            }, 0);

            const elapsedWorkTime = config.blocks.reduce((acc, block) => {
                const start = new Date(now.toDateString() + ' ' + block.start).getTime();
                const end = new Date(now.toDateString() + ' ' + block.end).getTime();
                if (now.getTime() > end) return acc + (end - start);
                if (now.getTime() > start) return acc + (now.getTime() - start);
                return acc;
            }, 0);

            const totalProgress = totalWorkTime !== 0 ? (elapsedWorkTime / totalWorkTime) * 100 : 0;
            document.querySelector('#total-progress-bar .progress').style.width = `${totalProgress}%`;
            document.querySelector('#total-progress-bar .percentage').innerText = `${totalProgress.toFixed(2)}%`;

            const blocksProgressHtml = config.blocks.map(block => {
                const start = new Date(now.toDateString() + ' ' + block.start).getTime();
                const end = new Date(now.toDateString() + ' ' + block.end).getTime();
                const blockDuration = end - start;
                let blockProgress = 0;
                if (now.getTime() > end) {
                    blockProgress = 100;
                } else if (now.getTime() > start) {
                    blockProgress = ((now.getTime() - start) / blockDuration) * 100;
                }
                const blockWidthPercentage = (blockDuration / totalWorkTime) * 100;
                return `
                    <div class="block-progress-bar" style="width: ${blockWidthPercentage}%">
                        <div class="progress" style="width: ${blockProgress}%"></div>
                        <div class="percentage">${blockProgress.toFixed(2)}%</div>
                    </div>
                `;
            }).join('');
            document.getElementById('blocks-progress').innerHTML = blocksProgressHtml;

            const elapsedTime = formatTime(elapsedWorkTime);
            const remainingTime = formatTime(totalWorkTime - elapsedWorkTime);
            document.getElementById('total-time').innerText = `(Total) Elapsed: ${elapsedTime} | Remaining: ${remainingTime}`;

            let currentBlockIndex = -1;
            for (let i = 0; i < config.blocks.length; i++) {
                const start = new Date(now.toDateString() + ' ' + config.blocks[i].start).getTime();
                const end = new Date(now.toDateString() + ' ' + config.blocks[i].end).getTime();
                if (now.getTime() >= start && now.getTime() <= end) {
                    currentBlockIndex = i;
                    break;
                }
            }

            if (currentBlockIndex === -1) {
                document.getElementById('block-info').classList.add('hidden');
                const lastBlockEnd = new Date(now.toDateString() + ' ' + config.blocks[config.blocks.length - 1].end).getTime();
                if (now.getTime() > lastBlockEnd) {
                    const overworkTime = now.getTime() - lastBlockEnd;
                    document.getElementById('overwork-time').innerText = `Overwork Time: ${formatTime(overworkTime)}`;
                } else {
                    document.getElementById('overwork-time').innerText = '';
                }
            } else {
                document.getElementById('block-info').classList.remove('hidden');
                const start = new Date(now.toDateString() + ' ' + config.blocks[currentBlockIndex].start).getTime();
                const end = new Date(now.toDateString() + ' ' + config.blocks[currentBlockIndex].end).getTime();
                const blockElapsedTime = formatTime(now.getTime() - start);
                const blockRemainingTime = formatTime(end - now.getTime());
                document.getElementById('block-time').innerHTML = `(Block) Elapsed: ${blockElapsedTime} | Remaining: ${blockRemainingTime}`;
                document.getElementById('overwork-time').innerText = '';
            }
        }

        // Dragging functionality
        let isDragging = false;
        let currentX;
        let currentY;
        let initialX;
        let initialY;
        let xOffset = 0;
        let yOffset = 0;

        function dragStart(e) {
            if (e.type === "touchstart") {
                initialX = e.touches[0].clientX - xOffset;
                initialY = e.touches[0].clientY - yOffset;
            } else {
                initialX = e.clientX - xOffset;
                initialY = e.clientY - yOffset;
            }
            
            if (e.target.closest('#ui-container')) {
                isDragging = true;
            }
        }

        function dragEnd(e) {
            initialX = currentX;
            initialY = currentY;
            isDragging = false;
            
            // Save position as percentage of viewport
            const container = document.getElementById('ui-container');
            const rect = container.getBoundingClientRect();
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            
            config.uiPosition = {
                x: (rect.left / viewportWidth) * 100,
                y: (rect.top / viewportHeight) * 100
            };
            saveConfig();
        }

        function drag(e) {
            if (isDragging) {
                e.preventDefault();
                
                if (e.type === "touchmove") {
                    currentX = e.touches[0].clientX - initialX;
                    currentY = e.touches[0].clientY - initialY;
                } else {
                    currentX = e.clientX - initialX;
                    currentY = e.clientY - initialY;
                }

                xOffset = currentX;
                yOffset = currentY;

                const container = document.getElementById('ui-container');
                container.style.transform = `translate(${currentX}px, ${currentY}px)`;
            }
        }

        function resetPosition() {
            const container = document.getElementById('ui-container');
            xOffset = 0;
            yOffset = 0;
            currentX = 0;
            currentY = 0;
            container.style.transform = 'translate(-50%, -50%)';
            config.uiPosition = { x: 50, y: 50 };
            saveConfig();
        }

        function toggleConfig() {
            document.getElementById('config').classList.toggle('show');
        }

        document.addEventListener('DOMContentLoaded', () => {
            // First load the config
            loadConfig();

            // Initialize UI controls with current values
            document.getElementById('dark-mode-toggle').checked = config.darkMode;
            document.getElementById('bg-opacity').value = config.bgOpacity;
            document.getElementById('ui-opacity').value = config.uiOpacity;
            document.getElementById('ui-width').value = config.uiWidth;
            
            const blocksInput = document.getElementById('blocks-input');
            blocksInput.value = config.blocks.map(block => block.start.replace(':', '') + '-' + block.end.replace(':', '')).join(',');

            document.getElementById('motto-input').value = config.motto;
            document.getElementById('motto').innerText = config.motto;

            document.getElementById('time-font-size-input').value = config.timeFontSize;
            document.getElementById('motto-font-size-input').value = config.mottoFontSize;

            // Now apply the config after DOM elements are ready
            updateConfig();

            document.getElementById('bg-image-input').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        config.bgImage = e.target.result;
                        saveConfig();
                        updateConfig();
                    };
                    reader.readAsDataURL(file);
                }
            });
            
            document.getElementById('bg-opacity').addEventListener('input', (e) => {
                config.bgOpacity = parseFloat(e.target.value);
                saveConfig();
                updateConfig();
            });

            document.getElementById('ui-opacity').addEventListener('input', (e) => {
                config.uiOpacity = parseFloat(e.target.value);
                saveConfig();
                updateConfig();
            });

            document.getElementById('ui-width').addEventListener('change', (e) => {
                config.uiWidth = parseInt(e.target.value);
                saveConfig();
                updateConfig();
            });

            document.getElementById('config-button').addEventListener('click', toggleConfig);

            // Add event listeners for auto-save
            document.getElementById('blocks-input').addEventListener('input', updateConfig);
            document.getElementById('motto-input').addEventListener('input', updateConfig);
            document.getElementById('dark-mode-toggle').addEventListener('change', updateConfig);
            document.getElementById('time-font-size-input').addEventListener('input', updateConfig);
            document.getElementById('motto-font-size-input').addEventListener('input', updateConfig);

            // Add drag event listeners
            const container = document.getElementById('ui-container');
            container.addEventListener("touchstart", dragStart, false);
            container.addEventListener("touchend", dragEnd, false);
            container.addEventListener("touchmove", drag, false);
            container.addEventListener("mousedown", dragStart, false);
            document.addEventListener("mousemove", drag, false);
            document.addEventListener("mouseup", dragEnd, false);

            document.getElementById('reset-position').addEventListener('click', resetPosition);

            setInterval(updateTime, 1000);
            updateTime();
        });
    </script>
</body>

</html>
