<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day Tracker</title>
    <style>
        :root {
            --bg-color: #fff;
            --text-color: #000;
            --progress-bg: #f3f3f3;
            --progress-color: #4caf50;
            --config-bg: #fff;
            --config-text: #000;
        }

        :root.dark-mode {
            --bg-color: #1e1e1e;
            --text-color: #fff;
            --progress-bg: #333;
            --progress-color: #6ca6cd;
            --config-bg: #333;
            --config-text: #fff;
        }

        body {
            font-family: monospace;
            text-align: center;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        #current-time {
            font-size: 48px;
            margin: 20px 0;
        }

        .progress-container {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }

        .block-progress-bar {
            height: 30px;
            background-color: var(--progress-bg);
            border: 1px solid #ccc;
            position: relative;
            flex-grow: 1;
            margin: 0 5px;
            display: flex;
            align-items: center;
        }

        .block-progress-bar .progress {
            height: 100%;
            background-color: var(--progress-color);
        }

        .block-progress-bar .percentage {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
        }

        .block-info {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }

        .block-info>div {
            margin: 0 10px;
        }

        .block-info.hidden {
            display: none;
        }

        #config {
            margin: 20px auto;
            display: none;
            background-color: var(--config-bg);
            color: var(--config-text);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 500px;
        }

        #config.show {
            display: block;
        }

        #config input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin: 10px 0;
            background-color: var(--config-bg);
            color: var(--config-text);
            border: 1px solid var(--text-color);
            border-radius: 5px;
        }

        #config .setting {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
        }

        #config .setting label {
            flex: 1;
            text-align: left;
        }

        #config .setting input[type="checkbox"],
        #config .setting input[type="number"] {
            width: auto;
        }

        #config-button {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            font-size: 14px;
            background-color: var(--progress-bg);
            color: var(--text-color);
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        #motto {
            font-size: 24px;
            margin: 10px 0;
        }
    </style>
</head>

<body>
    <button id="config-button">Config</button>
    <div id="motto"></div>
    <div id="current-time">00:00:00</div>
    <div class="progress-container">
        <div id="total-progress-bar" class="block-progress-bar">
            <div class="progress"></div>
            <div class="percentage">0.00%</div>
        </div>
    </div>
    <div class="progress-container" id="blocks-progress"></div>
    <div class="block-info" id="block-info">
        <div id="block-time"></div>
    </div>
    <div id="total-time"></div>
    <div id="overwork-time"></div>
    <div id="config">
        <input type="text" id="blocks-input" placeholder="Enter blocks (e.g., 0800-1230,1415-1830,1900-2030)">
        <input type="text" id="motto-input" placeholder="Enter your motto">
        <div class="setting">
            <label for="dark-mode-toggle">Dark Mode:</label>
            <input type="checkbox" id="dark-mode-toggle">
        </div>
        <div class="setting">
            <label for="time-font-size-input">Time Font Size:</label>
            <input type="number" id="time-font-size-input" min="12" max="100" step="2">
        </div>
        <div class="setting">
            <label for="motto-font-size-input">Motto Font Size:</label>
            <input type="number" id="motto-font-size-input" min="12" max="100" step="2">
        </div>
    </div>

    <script>
        let config = {
            blocks: [
                {
                    start: '10:00',
                    end: '12:00'
                }, 
                {
                    start: '14:00',
                    end: '18:00'
                }
            ],
            motto: 'hello world',
            darkMode: false,
            fontSize: 48
        };

        function loadConfig() {
            const savedConfig = localStorage.getItem('day-tracker');
            if (savedConfig) {
                config = JSON.parse(savedConfig);
            }
        }

        function saveConfig() {
            localStorage.setItem('day-tracker', JSON.stringify(config));
        }

        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const hours = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
            const minutes = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
            const seconds = (totalSeconds % 60).toString().padStart(2, '0');
            return `${hours}:${minutes}:${seconds}`;
        }

        function updateTime() {
            const now = new Date();
            const currentTime = now.toTimeString().split(' ')[0];
            document.getElementById('current-time').innerText = currentTime;

            if (config.blocks.length === 0) return;

            const totalWorkTime = config.blocks.reduce((acc, block) => {
                const start = new Date(now.toDateString() + ' ' + block.start).getTime();
                const end = new Date(now.toDateString() + ' ' + block.end).getTime();
                return acc + (end - start);
            }, 0);

            const elapsedWorkTime = config.blocks.reduce((acc, block) => {
                const start = new Date(now.toDateString() + ' ' + block.start).getTime();
                const end = new Date(now.toDateString() + ' ' + block.end).getTime();
                if (now.getTime() > end) return acc + (end - start);
                if (now.getTime() > start) return acc + (now.getTime() - start);
                return acc;
            }, 0);

            const totalProgress = totalWorkTime !== 0 ? (elapsedWorkTime / totalWorkTime) * 100 : 0;
            document.querySelector('#total-progress-bar .progress').style.width = `${totalProgress}%`;
            document.querySelector('#total-progress-bar .percentage').innerText = `${totalProgress.toFixed(2)}%`;

            const blocksProgressHtml = config.blocks.map(block => {
                const start = new Date(now.toDateString() + ' ' + block.start).getTime();
                const end = new Date(now.toDateString() + ' ' + block.end).getTime();
                const blockDuration = end - start;
                let blockProgress = 0;
                if (now.getTime() > end) {
                    blockProgress = 100;
                } else if (now.getTime() > start) {
                    blockProgress = ((now.getTime() - start) / blockDuration) * 100;
                }
                const blockWidthPercentage = (blockDuration / totalWorkTime) * 100;
                return `
                    <div class="block-progress-bar" style="width: ${blockWidthPercentage}%">
                        <div class="progress" style="width: ${blockProgress}%"></div>
                        <div class="percentage">${blockProgress.toFixed(2)}%</div>
                    </div>
                `;
            }).join('');
            document.getElementById('blocks-progress').innerHTML = blocksProgressHtml;

            const elapsedTime = formatTime(elapsedWorkTime);
            const remainingTime = formatTime(totalWorkTime - elapsedWorkTime);
            document.getElementById('total-time').innerText = `(Total) Elapsed: ${elapsedTime} | Remaining: ${remainingTime}`;

            let currentBlockIndex = -1;
            for (let i = 0; i < config.blocks.length; i++) {
                const start = new Date(now.toDateString() + ' ' + config.blocks[i].start).getTime();
                const end = new Date(now.toDateString() + ' ' + config.blocks[i].end).getTime();
                if (now.getTime() >= start && now.getTime() <= end) {
                    currentBlockIndex = i;
                    break;
                }
            }

            if (currentBlockIndex === -1) {
                document.getElementById('block-info').classList.add('hidden');
                const lastBlockEnd = new Date(now.toDateString() + ' ' + config.blocks[config.blocks.length - 1].end).getTime();
                if (now.getTime() > lastBlockEnd) {
                    const overworkTime = now.getTime() - lastBlockEnd;
                    document.getElementById('overwork-time').innerText = `Overwork Time: ${formatTime(overworkTime)}`;
                } else {
                    document.getElementById('overwork-time').innerText = '';
                }
            } else {
                document.getElementById('block-info').classList.remove('hidden');
                const start = new Date(now.toDateString() + ' ' + config.blocks[currentBlockIndex].start).getTime();
                const end = new Date(now.toDateString() + ' ' + config.blocks[currentBlockIndex].end).getTime();
                const blockElapsedTime = formatTime(now.getTime() - start);
                const blockRemainingTime = formatTime(end - now.getTime());
                document.getElementById('block-time').innerHTML = `(Block) Elapsed: ${blockElapsedTime} | Remaining: ${blockRemainingTime}`;
                document.getElementById('overwork-time').innerText = '';
            }
        }

        function updateConfig() {
            const blocksInput = document.getElementById('blocks-input').value;
            config.blocks = blocksInput.split(',').map(block => {
                const [start, end] = block.trim().split('-').map(time => time.trim());
                return { start: start.slice(0, 2) + ':' + start.slice(2), end: end.slice(0, 2) + ':' + end.slice(2) };
            });

            config.motto = document.getElementById('motto-input').value;
            document.getElementById('motto').innerText = config.motto;

            config.darkMode = document.getElementById('dark-mode-toggle').checked;
            document.documentElement.classList.toggle('dark-mode', config.darkMode);

            config.timeFontSize = document.getElementById('time-font-size-input').value;
            document.getElementById('current-time').style.fontSize = `${config.timeFontSize}px`;

            config.mottoFontSize = document.getElementById('motto-font-size-input').value;
            document.getElementById('motto').style.fontSize = `${config.mottoFontSize}px`;

            saveConfig();
            updateTime();
        }

        function toggleConfig() {
            document.getElementById('config').classList.toggle('show');
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadConfig();

            document.getElementById('dark-mode-toggle').checked = config.darkMode;
            document.documentElement.classList.toggle('dark-mode', config.darkMode);

            document.getElementById('time-font-size-input').value = config.timeFontSize;
            document.getElementById('current-time').style.fontSize = `${config.timeFontSize}px`;

            document.getElementById('motto-font-size-input').value = config.mottoFontSize;
            document.getElementById('motto').style.fontSize = `${config.mottoFontSize}px`;

            const blocksInput = document.getElementById('blocks-input');
            blocksInput.value = config.blocks.map(block => block.start.replace(':', '') + '-' + block.end.replace(':', '')).join(',');

            document.getElementById('motto-input').value = config.motto;
            document.getElementById('motto').innerText = config.motto;

            document.getElementById('config-button').addEventListener('click', toggleConfig);

            // Add event listeners for auto-save
            document.getElementById('blocks-input').addEventListener('input', updateConfig);
            document.getElementById('motto-input').addEventListener('input', updateConfig);
            document.getElementById('dark-mode-toggle').addEventListener('change', updateConfig);
            document.getElementById('time-font-size-input').addEventListener('input', updateConfig);
            document.getElementById('motto-font-size-input').addEventListener('input', updateConfig);

            setInterval(updateTime, 1000);
            updateTime();
        });
    </script>
</body>

</html>
